
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Café Table Reservation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="inner-page">
  <main class="container py-5">
    <section class="form-card mx-auto">
      <header class="form-heading">
        <p class="eyebrow">Welcome to our café</p>
        <h1>Reserve a table</h1>
        <p>Tell us about your visit.</p>
      </header>

      <form action="#" method="get">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="guestName">Your name *</label>
            <input class="form-control" id="guestName" name="guestName" type="text" autocomplete="name" required>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="guestEmail">Email *</label>
            <input class="form-control" id="guestEmail" name="guestEmail" type="email" autocomplete="email" required>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="guestPhone">Phone *</label>
            <input class="form-control" id="guestPhone" name="guestPhone" type="tel" autocomplete="tel" required>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="guests">Number of guests *</label>
            <input class="form-control" id="guests" name="guests" type="number" min="1" max="20" step="1" required>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="reservationDate">Reservation date *</label>
            <input class="form-control" id="reservationDate" name="reservationDate" type="date" required>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="reservationTime">Reservation time *</label>
            <input class="form-control" id="reservationTime" name="reservationTime" type="time" required>
          </div>

          <fieldset class="col-12">
            <legend class="form-label">Seating preference *</legend>
            <div class="d-flex flex-wrap gap-4">
              <div class="form-check">
                <input class="form-check-input" id="inside" name="seating" type="radio" value="Inside" required>
                <label class="form-check-label" for="inside">Inside</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" id="terrace" name="seating" type="radio" value="Terrace">
                <label class="form-check-label" for="terrace">Terrace</label>
              </div>
            </div>
          </fieldset>

          <div class="col-12">
            <label class="form-label" for="comments">Additional requests</label>
            <textarea class="form-control" id="comments" name="comments" rows="3"></textarea>
          </div>

          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" id="terms" name="terms" type="checkbox" value="accepted" required>
              <label class="form-check-label" for="terms">I agree to the reservation terms. *</label>
            </div>
          </div>

          <div class="col-12">
            <button class="btn btn-search w-100" type="submit">Reserve table</button>
          </div>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
