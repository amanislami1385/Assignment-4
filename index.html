
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Train Ticket Booking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="train-page">
  <main class="container py-4 py-lg-5">
    <section class="booking-card mx-auto">
      <header class="booking-header">
        <h1>Book a train ticket</h1>
        <p>Plan your next journey with us</p>
      </header>

      <form class="booking-form" action="#" method="get">
        <fieldset class="mb-4">
          <legend class="visually-hidden">Trip type</legend>
          <div class="trip-options">
            <input class="btn-check" type="radio" name="tripType" id="oneWay" value="one-way" checked>
            <label for="oneWay">One way</label>
            <input class="btn-check" type="radio" name="tripType" id="roundTrip" value="round-trip">
            <label for="roundTrip">Round trip</label>
          </div>
        </fieldset>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label" for="from">From</label>
            <input class="form-control" id="from" name="from" type="text" placeholder="Departure city" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="to">To</label>
            <input class="form-control" id="to" name="to" type="text" placeholder="Destination city" required>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label" for="departure">Departure</label>
            <input class="form-control" id="departure" name="departure" type="date" required>
          </div>
          <div class="col-md-4">
            <label class="form-label" for="returnDate">Return</label>
            <input class="form-control" id="returnDate" name="returnDate" type="date">
          </div>
          <div class="col-md-4">
            <label class="form-label" for="passengers">Passengers</label>
            <select class="form-select" id="passengers" name="passengers">
              <option value="1" selected>1 adult</option>
              <option value="2">2 adults</option>
              <option value="3">3 adults</option>
              <option value="4">4 adults</option>
              <option value="5">5 adults</option>
              <option value="6">6 adults</option>
            </select>
          </div>
        </div>

        <fieldset class="mb-4">
          <legend class="form-label">Carriage class</legend>
          <div class="class-options">
            <div class="form-check">
              <input class="form-check-input" id="standard" name="carriage" type="radio" value="standard" required>
              <label class="form-check-label" for="standard">Standard</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" id="coupe" name="carriage" type="radio" value="coupe">
              <label class="form-check-label" for="coupe">Coupé</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" id="sleeper" name="carriage" type="radio" value="sleeper">
              <label class="form-check-label" for="sleeper">Sleeper</label>
            </div>
          </div>
        </fieldset>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label" for="phone">Phone</label>
            <div class="input-group">
              <span class="input-group-text">+7</span>
              <input class="form-control" id="phone" name="phone" type="tel" autocomplete="tel-national" placeholder="701 234 56 78" required>
            </div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required>
          </div>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" id="sms" name="sms" type="checkbox" value="yes">
          <label class="form-check-label" for="sms">Send ticket updates by SMS</label>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" id="agreement" name="agreement" type="checkbox" value="yes" required>
          <label class="form-check-label" for="agreement">I agree to the carriage rules</label>
        </div>

        <div class="booking-actions">
          <button class="btn btn-clear" type="reset">Clear</button>
          <button class="btn btn-search" type="submit">Find trains</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
